<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>足球预测工作台</title>
<style>
:root {
  --bg: #0d1f17; --bg2: #123326; --card: #16382a; --card2: #1c4433;
  --ink: #e8f0eb; --muted: #8fae9e; --gold: #e9b44c; --green: #4ade80;
  --red: #f87171; --line: #27523e; --blue: #60a5fa;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: "Microsoft YaHei", sans-serif; font-size: 14px; }
header { background: var(--bg2); padding: 14px 24px; display: flex; align-items: center; gap: 16px; border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 10; flex-wrap: wrap; }
header h1 { font-size: 18px; color: var(--gold); letter-spacing: 1px; }
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
button { background: var(--card2); color: var(--ink); border: 1px solid var(--line); padding: 7px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; }
button:hover { border-color: var(--gold); }
button.primary { background: #1b5e3b; border-color: #2d8f5a; }
button:disabled { opacity: 0.45; cursor: not-allowed; }
input[type=date] { background: var(--card2); color: var(--ink); border: 1px solid var(--line); padding: 6px 10px; border-radius: 6px; }
#progress { flex: 1; min-width: 240px; display: none; align-items: center; gap: 10px; }
#bar { flex: 1; height: 8px; background: var(--card); border-radius: 4px; overflow: hidden; }
#barFill { height: 100%; background: var(--gold); width: 0%; }
main { padding: 16px 24px; max-width: 1680px; margin: 0 auto; }
.stats { display: flex; gap: 12px; flex-wrap: wrap; margin: 12px 0; }
.stat { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 10px 18px; }
.stat b { font-size: 22px; color: var(--gold); display: block; }
.stat span { font-size: 12px; color: var(--muted); }
.muted { color: var(--muted); font-size: 12px; margin: 0 0 8px; }
.hit { color: var(--green); font-weight: bold; }
.nohit { color: var(--red); }
h2 { font-size: 16px; margin: 20px 0 10px; color: var(--gold); }
.league-nav { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 16px; }
.league-nav a { color: var(--gold); text-decoration: none; border: 1px solid var(--line); padding: 4px 10px; border-radius: 14px; font-size: 12px; background: var(--card); }
.league-nav a:hover { border-color: var(--gold); }
.view-toggle { display: inline-flex; gap: 6px; margin-left: 12px; vertical-align: middle; }
.view-toggle button { padding: 4px 12px; border-radius: 14px; font-size: 12px; }
.view-toggle button.on { background: #1b5e3b; border-color: var(--gold); color: var(--gold); }
.league-block { margin: 0 0 22px; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--card); }
.league-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 10px 14px; background: var(--bg2); }
.league-head h3 { font-size: 15px; color: var(--gold); }
.league-head span { font-size: 12px; color: var(--muted); }
.hist-pane { margin: 8px 0 28px; padding: 4px 0 8px; border-top: 2px solid var(--line); }
.hist-pane h3.pane-title { font-size: 17px; margin: 14px 0 8px; }
.hist-pane.settled h3.pane-title { color: var(--green); }
.hist-pane.pending h3.pane-title { color: var(--gold); }
table { width: 100%; border-collapse: collapse; background: var(--card); }
th { background: var(--bg2); padding: 8px 6px; font-size: 12px; color: var(--muted); text-align: center; white-space: nowrap; }
td { padding: 7px 6px; text-align: center; border-top: 1px solid var(--line); font-size: 13px; }
tr:hover td { background: var(--card2); }
.miss { color: var(--gold); font-weight: bold; }
.ok { color: var(--green); }
.tag { display: inline-block; font-size: 11px; padding: 1px 6px; border-radius: 3px; background: var(--bg2); color: var(--muted); }
.banner { padding: 10px 14px; border-radius: 6px; margin: 10px 0; font-size: 13px; }
.banner.err { background: #3d1c1c; border: 1px solid #7a3434; color: #fca5a5; }
.banner.ok { background: #153a26; border: 1px solid #2d6b47; color: #86efac; }
.banner.warn { background: #2b2113; border: 1px solid #6b5420; color: var(--gold); }
footer { text-align: center; color: var(--muted); font-size: 12px; padding: 24px; }
tr.clickable { cursor: pointer; }
.lamp { display: inline-block; font-size: 11px; padding: 1px 6px; border-radius: 10px; margin: 0 2px; }
.lamp.ok { background: #153a26; color: var(--green); }
.lamp.warn { background: #2b2113; color: var(--gold); }
.lamp.bad { background: #3d1c1c; color: #fca5a5; }
.lamp-stack { text-align: left; max-width: 320px; margin: 0 auto; }
.lamp-item { margin: 0 0 6px; }
.lamp-why { display: block; font-size: 11px; color: var(--muted); line-height: 1.35; margin-top: 2px; }
.drawer-mask { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 20; }
.drawer-mask.on { display: block; }
.drawer-panel { position: fixed; top: 0; right: -520px; width: min(520px, 96vw); height: 100%; background: var(--bg2); border-left: 1px solid var(--line); z-index: 21; overflow: auto; padding: 16px 18px 32px; transition: right .2s; }
.drawer-panel.on { right: 0; }
.drawer-panel h3 { color: var(--gold); margin: 16px 0 8px; font-size: 15px; }
.drawer-panel p, .drawer-panel li { color: var(--ink); font-size: 13px; line-height: 1.5; }
.drawer-panel ul { padding-left: 18px; }
</style>
</head>
<body>
<header>
  <h1>足球预测工作台</h1>
  <div class="toolbar">
    <input type="date" id="kickoffDate" title="采集/补登记按开球日">
    <button type="button" id="btnRefresh" onclick="loadBoard(true)">刷新看板</button>
    <button class="primary" id="btnCollect" onclick="doCollect()">采集开球日</button>
    <button class="primary" id="btnPredict" onclick="doPredict()">补登记未预测</button>
    <button id="btnSettle" onclick="doSettle()">手动结算</button>
    <button class="primary" id="btnBacktest" onclick="doBacktest()">回测</button>
    <button class="primary" id="btnLlm" onclick="doLlm()">跑 LLM 轨</button>
    <button onclick="window.open('/api/export/report','_blank')">导出看板</button>
    <div id="progress"><span id="pMsg">…</span><div id="bar"><div id="barFill"></div></div></div>
  </div>
</header>
<main>
  <div id="banner"></div>
  <div class="stats" id="stats"></div>
  <h2>已开售
    <span class="view-toggle">
      <button type="button" id="btnByLeague" class="on" onclick="setSaleView('league')">按联赛</button>
      <button type="button" id="btnByTime" onclick="setSaleView('time')">按时间</button>
    </span>
  </h2>
  <div class="league-nav" id="leagueNav"></div>
  <div id="leagues"></div>
  <h2>历史登记 / 回测
    <span class="view-toggle">
      <button type="button" id="btnHistAll" class="on" onclick="setHistView('all')">全部日期</button>
      <button type="button" id="btnHistDay" onclick="setHistView('day')">单日</button>
    </span>
  </h2>
  <p class="muted" id="histNote"></p>
  <div class="league-nav" id="histNav"></div>
  <div class="stats" id="histStats"></div>
  <div id="histTable"></div>
  <h2>研究库（伤停 / 首发，不进 1X2）</h2>
  <div id="late"></div>
</main>
<div class="drawer-mask" id="drawerMask" onclick="closeDrawer()"></div>
<aside class="drawer-panel" id="drawerPanel"></aside>
<footer>只读融合库 · 登记 market_only · 双轨不合并 · 回测手动 · 概率模型输出，非投注建议</footer>
<script>
let pollTimer = null;

function todayStr() {
  const d = new Date(Date.now() + 8 * 3600 * 1000);
  return d.toISOString().slice(0, 10);
}
document.getElementById("kickoffDate").value = todayStr();

function banner(msg, cls) {
  const b = document.getElementById("banner");
  if (!msg) { b.innerHTML = ""; return; }
  b.innerHTML = `<div class="banner ${cls}">${msg}</div>`;
}

async function api(path, opt) {
  const sep = path.includes("?") ? "&" : "?";
  const url = path + sep + "_=" + Date.now();
  const r = await fetch(url, Object.assign({ cache: "no-store" }, opt || {}));
  if (!r.ok) throw new Error((await r.text()).slice(0, 240));
  if ((r.headers.get("content-type") || "").includes("json")) return r.json();
  return {};
}

function dayBody() {
  return JSON.stringify({ kickoff_date: document.getElementById("kickoffDate").value });
}

function runAction(btnId, path, startMsg) {
  const btn = document.getElementById(btnId);
  btn.disabled = true;
  banner(startMsg, "ok");
  api(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: dayBody() })
    .then(r => watchRun(r.run_id, () => { btn.disabled = false; loadBoard(); if (typeof loadHistory === "function") loadHistory(); }))
    .catch(e => { banner(e.message, "err"); btn.disabled = false; });
}

function doCollect() { runAction("btnCollect", "/api/collect", "采集任务已启动（写入 fusion forward）…"); }
function doPredict() { runAction("btnPredict", "/api/predict", "只补有盘未登记场次，market_only…"); }
function doSettle() { runAction("btnSettle", "/api/settle", "手动结算…"); }
function doBacktest() { runAction("btnBacktest", "/api/backtest", "回测已启动：结算 + 量化 + 双轨…"); }
function doLlm() { runAction("btnLlm", "/api/llm", "LLM 轨启动（glm 审计 + DeepSeek/kimi，不与量化合成）…"); }

function watchRun(runId, onDone) {
  const pg = document.getElementById("progress");
  pg.style.display = "flex";
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(async () => {
    try {
      const r = await api(`/api/run/${runId}`);
      document.getElementById("pMsg").textContent = r.message || r.status;
      if (r.total > 0) document.getElementById("barFill").style.width = (r.done / r.total * 100) + "%";
      if (r.status === "done" || r.status === "error") {
        clearInterval(pollTimer); pg.style.display = "none";
        banner((r.status === "done" ? "✅ " : "❌ ") + (r.message || r.status), r.status === "done" ? "ok" : "err");
        onDone();
      }
    } catch (e) {
      clearInterval(pollTimer); pg.style.display = "none"; banner(e.message, "err"); onDone();
    }
  }, 3000);
}

function pct(p) {
  if (!p) return "-";
  return p.map(x => Number(x).toFixed(1)).join(" / ");
}

const STATUS_ZH = {
  UNAVAILABLE: "暂无数据",
  VALID: "有效",
  NO_API_ID: "无供应商场次号",
  TOO_EARLY: "未到T-75",
  POST_KICKOFF: "已开球",
  MISSING: "缺失",
  MARKET_BASELINE: "市场基线",
};
function zh(s) {
  if (!s || s === "-") return "-";
  if (STATUS_ZH[s]) return STATUS_ZH[s];
  return String(s)
    .replace(/\bVALID\b/g, "有效")
    .replace(/\bUNAVAILABLE\b/g, "暂无数据");
}

let saleView = "league";
let lastBoard = null;

function setSaleView(mode) {
  saleView = mode;
  document.getElementById("btnByLeague").classList.toggle("on", mode === "league");
  document.getElementById("btnByTime").classList.toggle("on", mode === "time");
  if (lastBoard) renderSaleBoard(lastBoard);
}

function lamps(lights) {
  if (!lights) return '<span class="tag" title="没有证据文件">无证据</span>';
  const cls = {
    previous: "ok", current: "ok", missing: "warn",
    two_source: "ok", conflict: "warn", not_written: "warn", not_collected: "bad", none: "bad",
    dual: "ok", single: "warn",
  };
  const one = (code, label, reason) => {
    const why = (reason || "").replace(/</g, "&lt;");
    return `<div class="lamp-item"><span class="lamp ${cls[code] || "bad"}" title="${why.replace(/"/g, "&quot;")}">${label}</span><span class="lamp-why">${why || "无原因"}</span></div>`;
  };
  return `<div class="lamp-stack">`
    + one(lights.form, lights.form_zh, lights.form_reason)
    + one(lights.lineup, lights.lineup_zh, lights.lineup_reason)
    + one(lights.injury, lights.injury_zh, lights.injury_reason)
    + `</div>`;
}

function dirMap() {
  return { H: "主胜", D: "平局", A: "客胜", 主胜: "主胜", 平局: "平局", 客胜: "客胜" };
}

function llmDirText(llm) {
  if (!llm) return '<span class="tag">未投票</span>';
  const map = dirMap();
  const dir = map[llm.direction] || llm.direction;
  const alt = map[llm.alt_direction] || llm.alt_direction;
  if (dir && alt) return `<span class="ok">${dir}/${alt}</span>`;
  if (dir) return `<span class="ok">${dir}</span>`;
  return '<span class="tag">已采集</span>';
}

function llmScoreText(llm) {
  const scores = (llm && llm.top_scores) || [];
  return scores.length ? scores.join(" / ") : "-";
}

function saleRow(m) {
  const q = m.quant;
  const llm = m.llm;
  const li = m.late_info || {};
  const pred = q
    ? `<span class="ok">已登记</span>`
    : (m.has_odds ? `<span class="miss">未预测</span>` : `<span class="tag">无HAD</span>`);
  const st = (m.status_name && m.status_name !== "已开售")
    ? `<div class="tag">${m.status_name}</div>` : "";
  const mid = m.match_id || "";
  return `<tr class="clickable" onclick="openMatch('${mid}')">
    <td>${m.match_num || ""}<div class="tag">${mid}</div>${st}</td>
    <td>${m.home || ""} vs ${m.away || ""}</td>
    <td>${(m.kickoff || "").slice(5, 16)}</td>
    <td>${m.odds ? m.odds.join(" / ") : "-"}</td>
    <td>${pct(q && q.final_1x2_pct)}</td>
    <td>${q && q.top_scores ? q.top_scores.join(" / ") : "-"}</td>
    <td>${llmDirText(llm)}</td>
    <td>${llmScoreText(llm)}</td>
    <td>${zh((q && q.gate) || "-")}</td>
    <td>${pred}</td>
    <td>${lamps(m.lights)}</td>
    <td>${zh(li.injury_zh || li.injury)}</td>
  </tr>`;
}

function isSaleWindow(m) {
  return m.status_name === "已开售" || m.status_name === "暂停销售";
}

function saleGroupsByTime(d) {
  const selling = (d.matches || []).filter(isSaleWindow);
  const buckets = {};
  selling.forEach(m => {
    const day = (m.kickoff || "").slice(0, 10) || "未知";
    if (!buckets[day]) buckets[day] = [];
    buckets[day].push(m);
  });
  return Object.keys(buckets).sort().map(day => {
    const items = buckets[day].slice().sort((a, b) =>
      (a.kickoff || "").localeCompare(b.kickoff || "") || (a.match_num || "").localeCompare(b.match_num || ""));
    return {
      key: "tm-" + day,
      title: day,
      n: items.length,
      predicted: items.filter(m => m.quant).length,
      missing_pred: items.filter(m => m.bucket === "missing_pred").length,
      matches: items,
    };
  });
}

function renderSaleBoard(d) {
  const slug = (name) => "lg-" + encodeURIComponent(name).replace(/%/g, "");
  const head = `<tr><th>场次</th><th>比赛</th><th>开球</th><th>HAD</th><th>量化 主/平/客</th><th>量化比分</th><th>LLM 胜平负</th><th>LLM 比分</th><th>门控</th><th>登记</th><th>证据灯</th><th>伤停</th></tr>`;
  const groups = saleView === "time"
    ? saleGroupsByTime(d)
    : (d.by_league || []).map(g => ({
        key: slug(g.league),
        title: g.league,
        n: g.n,
        predicted: g.predicted,
        missing_pred: g.missing_pred,
        matches: g.matches,
      }));
  document.getElementById("leagueNav").innerHTML = groups.map(g =>
    `<a href="#${g.key}">${g.title} ${g.n}</a>`).join("");
  document.getElementById("leagues").innerHTML = groups.map(g => {
    const miss = g.missing_pred ? ` · 未预测 ${g.missing_pred}` : "";
    return `<section class="league-block" id="${g.key}">
      <div class="league-head"><h3>${g.title}</h3><span>${g.n} 场 · 已登记 ${g.predicted}${miss}</span></div>
      <table><thead>${head}</thead><tbody>${g.matches.map(saleRow).join("")}</tbody></table>
    </section>`;
  }).join("");
}

async function loadBoard(force) {
  const btn = document.getElementById("btnRefresh");
  if (btn) {
    btn.disabled = true;
    btn.textContent = "刷新中…";
  }
  if (force) {
    lastHistFull = null;
    banner("正在刷新看板和回测…", "ok");
  }
  try {
    const d = await api("/api/board");
    lastBoard = d;
    const s = d.summary;
    document.getElementById("stats").innerHTML = `
      <div class="stat"><b>${s.on_sale}</b><span>已开售</span></div>
      <div class="stat"><b>${s.has_odds}</b><span>未开球有盘</span></div>
      <div class="stat"><b>${s.predicted}</b><span>已登记</span></div>
      <div class="stat"><b>${s.missing_pred}</b><span>有盘未预测</span></div>
      <div class="stat"><b>${s.no_odds}</b><span>开售无 HAD</span></div>
      <div class="stat"><b>${s.llm_collected || 0}</b><span>LLM 证据已采集</span></div>
      <div class="stat"><b>${s.llm_predicted || 0}</b><span>LLM 已出方向</span></div>`;
    const late = d.late_info || {};
    document.getElementById("late").innerHTML =
      `<div class="banner warn">伤停有效 ${late.injury_valid || 0} · 首发有效 ${late.lineup_valid || 0} · 过门事件 ${late.late_events || 0} · 研究门槛 ${late.toward_200} 场。${late.note || ""}</div>`;
    renderSaleBoard(d);
    if (force || !lastHistFull) await loadHistory(!!force);
    banner(`已刷新 ${d.as_of || ""} · ${d.note || ""}`, "ok");
  } catch (e) {
    banner("看板失败: " + e.message, "err");
  } finally {
    if (btn) {
      btn.disabled = false;
      btn.textContent = "刷新看板";
    }
  }
}

let histDay = "";
let histView = "all";
let lastHistFull = null;

function setHistView(mode) {
  histView = mode;
  document.getElementById("btnHistAll").classList.toggle("on", mode === "all");
  document.getElementById("btnHistDay").classList.toggle("on", mode === "day");
  if (lastHistFull) renderHistory(lastHistFull);
}

function hitRateLabel(s) {
  const q = (!s || s.settled === 0 || s.hit_rate == null)
    ? "量化命中率 —"
    : `量化命中率 ${s.hit_rate}%（${s.hit_rate_text}）`;
  const llm = (!s || !s.llm_n || s.llm_hit_rate == null)
    ? "LLM命中率 —"
    : `LLM命中率 ${s.llm_hit_rate}%（${s.llm_hit_rate_text}）`;
  return `${q} · ${llm}`;
}

function histCell(m) {
  const q = m.quant || {};
  const res = m.result || {};
  const score = res.score_90 ? res.score_90.join("-") : "-";
  const actual = res.direction || "-";
  let hit = '<span class="tag">未结算</span>';
  if (m.settled) {
    hit = m.hit ? '<span class="hit">命中</span>' : '<span class="nohit">未中</span>';
  }
  const llm = m.llm;
  const llmTxt = llmDirText(llm);
  let llmHit = '<span class="tag">未评分</span>';
  if (m.llm_scored) {
    llmHit = m.llm_hit ? '<span class="hit">命中</span>' : '<span class="nohit">未中</span>';
  } else if (m.settled && llm && (llm.direction || llm.alt_direction)) {
    llmHit = '<span class="tag">未评分</span>';
  }
  return `<tr class="clickable" onclick="openMatch('${m.match_id || ""}')">
    <td>${m.match_num || ""}<div class="tag">${m.match_id || ""}</div></td>
    <td>${m.home || ""} vs ${m.away || ""}</td>
    <td>${(m.kickoff || "").slice(5, 16)}</td>
    <td>${q.direction || "-"}</td>
    <td>${pct(q.final_1x2_pct)}</td>
    <td>${(q.top_scores || []).join(" / ") || "-"}</td>
    <td>${score} ${actual !== "-" ? actual : ""}</td>
    <td>${hit}</td>
    <td>${llmTxt}</td>
    <td>${llmScoreText(llm)}</td>
    <td>${llmHit}</td>
    <td>${lamps(m.lights)}</td>
  </tr>`;
}

function histHead() {
  return `<tr><th>场次</th><th>比赛</th><th>开球</th><th>量化方向</th><th>主/平/客%</th><th>比分Top</th><th>赛果</th><th>量化回测</th><th>LLM 胜平负</th><th>LLM 比分</th><th>LLM回测</th><th>证据灯</th></tr>`;
}

function clientHitStats(matches) {
  const settled = matches.filter(m => m.settled);
  const hit = settled.filter(m => m.hit).length;
  const llmScored = matches.filter(m => m.llm_scored);
  const llmHit = llmScored.filter(m => m.llm_hit).length;
  return {
    n: matches.length,
    settled: settled.length,
    hit,
    miss: settled.length - hit,
    hit_rate: settled.length ? Math.round(hit / settled.length * 1000) / 10 : null,
    hit_rate_text: settled.length ? `${hit}/${settled.length}` : null,
    llm_n: llmScored.length,
    llm_hit: llmHit,
    llm_hit_rate: llmScored.length ? Math.round(llmHit / llmScored.length * 1000) / 10 : null,
    llm_hit_rate_text: llmScored.length ? `${llmHit}/${llmScored.length}` : null,
  };
}

function splitLeagueGroups(groups) {
  const settled = [];
  const pending = [];
  (groups || []).forEach(g => {
    const done = (g.matches || []).filter(m => m.settled);
    const wait = (g.matches || []).filter(m => !m.settled);
    if (done.length) settled.push({ league: g.league, matches: done, ...clientHitStats(done) });
    if (wait.length) pending.push({ league: g.league, matches: wait, ...clientHitStats(wait) });
  });
  return { settled, pending };
}

function renderHistLeagues(groups, day, kind) {
  const slug = (name) => "hl-" + day + "-" + kind + "-" + encodeURIComponent(name).replace(/%/g, "");
  if (!groups.length) {
    return `<div class="banner warn">${kind === "pending" ? day + " 没有未结算场次。" : day + " 没有已结算场次。"}</div>`;
  }
  const nav = groups.map(g => {
    const extra = kind === "pending"
      ? ""
      : `${g.hit_rate != null ? " · 量化" + g.hit_rate + "%" : ""}${g.llm_hit_rate != null ? " · LLM" + g.llm_hit_rate + "%" : ""}`;
    return `<a href="#${slug(g.league)}">${g.league} ${g.n}${extra}</a>`;
  }).join("");
  const blocks = groups.map(g => {
    const sub = kind === "pending"
      ? `${g.n} 场 · 尚未结算`
      : `${g.n} 场 · ${hitRateLabel(g)}`;
    const tag = kind === "pending" ? "（未结算）" : "（已结算）";
    return `<section class="league-block" id="${slug(g.league)}">
      <div class="league-head">
        <h3>${day} · ${g.league}${tag}</h3>
        <span>${sub}</span>
      </div>
      <table><thead>${histHead()}</thead><tbody>${(g.matches || []).map(histCell).join("")}</tbody></table>
    </section>`;
  }).join("");
  return `<div class="league-nav">${nav}</div>${blocks}`;
}

function renderDaySplit(sec) {
  const parts = splitLeagueGroups(sec.by_league || []);
  const day = sec.day;
  const nDone = parts.settled.reduce((n, g) => n + g.n, 0);
  const nWait = parts.pending.reduce((n, g) => n + g.n, 0);
  const done = nDone ? `<div class="hist-pane settled" id="hist-${day}-done">
      <h3 class="pane-title">已结算 · ${day} · ${nDone} 场 · ${hitRateLabel(clientHitStats((sec.matches || []).filter(m => m.settled)))}</h3>
      ${renderHistLeagues(parts.settled, day, "done")}
    </div>` : "";
  const wait = nWait ? `<div class="hist-pane pending" id="hist-${day}-wait">
      <h3 class="pane-title">未结算 · ${day} · ${nWait} 场</h3>
      ${renderHistLeagues(parts.pending, day, "pending")}
    </div>` : "";
  return `<div id="hist-${day}">${done}${wait || (!nDone ? `<div class="banner warn">${day} 没有登记。</div>` : "")}</div>`;
}

function renderHistory(full) {
  const days = full.days || [];
  document.getElementById("histNote").textContent = full.note || "";
  document.getElementById("histNav").innerHTML = days.map(d => {
    const rate = d.hit_rate != null ? ` · 量化${d.hit_rate}%` : "";
    const llm = d.llm_hit_rate != null ? ` / LLM${d.llm_hit_rate}%` : "";
    const settled = d.settled ? ` · 已结${d.settled}${rate}${llm}` : "";
    const on = d.day === histDay ? ' style="border-color:var(--gold)"' : "";
    return `<a href="#hist-${d.day}" data-day="${d.day}"${on}>${d.day} ${d.n}场${settled}</a>`;
  }).join("");
  document.querySelectorAll("#histNav a").forEach(a => {
    a.onclick = (e) => {
      e.preventDefault();
      histDay = a.dataset.day;
      if (histView === "all") {
        const el = document.getElementById("hist-" + a.dataset.day)
          || document.getElementById("hist-" + a.dataset.day + "-done")
          || document.getElementById("hist-" + a.dataset.day + "-wait");
        if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
        document.querySelectorAll("#histNav a").forEach(x => {
          x.style.borderColor = x.dataset.day === a.dataset.day ? "var(--gold)" : "";
        });
      } else {
        renderHistory(full);
      }
    };
  });
  if (!days.length) {
    document.getElementById("histStats").innerHTML = "";
    document.getElementById("histTable").innerHTML = '<div class="banner warn">登记库里还没有历史场次。</div>';
    return;
  }
  if (histView === "all") {
    renderHistStats(full, "全部");
    document.getElementById("histTable").innerHTML = (full.sections || []).map(renderDaySplit).join("");
    return;
  }
  const d = (full.sections || []).find(s => s.day === histDay) || { day: histDay, by_league: [] };
  renderHistStats(d.summary || d, histDay);
  document.getElementById("histTable").innerHTML = renderDaySplit(d);
}

function renderHistStats(s, label) {
  const n = s.n != null ? s.n : (s.total || 0);
  const rate = s.hit_rate == null ? "—" : s.hit_rate + "%";
  const sub = s.hit_rate_text ? `量化命中率 ${s.hit_rate_text}` : "量化命中率（未结算）";
  const llmRate = s.llm_hit_rate == null ? "—" : s.llm_hit_rate + "%";
  const llmSub = s.llm_hit_rate_text ? `LLM命中率 ${s.llm_hit_rate_text}` : "LLM命中率（无方向或未结算）";
  document.getElementById("histStats").innerHTML = `
    <div class="stat"><b>${n}</b><span>${label} 登记</span></div>
    <div class="stat"><b>${s.settled || 0}</b><span>已结算</span></div>
    <div class="stat"><b>${s.hit || 0}</b><span>量化命中</span></div>
    <div class="stat"><b>${rate}</b><span>${sub}</span></div>
    <div class="stat"><b>${s.llm_n || 0}</b><span>LLM已评分</span></div>
    <div class="stat"><b>${s.llm_hit || 0}</b><span>LLM命中</span></div>
    <div class="stat"><b>${llmRate}</b><span>${llmSub}</span></div>`;
}

async function loadHistory(force) {
  try {
    if (force) lastHistFull = null;
    const full = lastHistFull || await api("/api/history?full=1");
    lastHistFull = full;
    const days = full.days || [];
    histDay = histDay || (days.find(d => d.settled > 0) || days[0] || {}).day || "";
    renderHistory(full);
  } catch (e) {
    document.getElementById("histTable").innerHTML = `<div class="banner err">历史加载失败: ${e.message}</div>`;
  }
}

function closeDrawer() {
  document.getElementById("drawerMask").classList.remove("on");
  document.getElementById("drawerPanel").classList.remove("on");
}

function openMatch(mid) {
  if (!mid) return;
  api("/api/match/" + encodeURIComponent(mid)).then(d => {
    const q = d.quant || {};
    const llm = d.llm || {};
    const res = d.result || {};
    const ou = q.ou_2_5 || {};
    const facts = (d.evidence_facts || []).map(x => `<li>${x}</li>`).join("") || "<li>无证据行</li>";
    document.getElementById("drawerPanel").innerHTML = `
      <button onclick="closeDrawer()">关闭</button>
      <h3>${mid}</h3>
      <p>${q.home || llm.home || ""} vs ${q.away || llm.away || ""} · ${q.match_num || ""} · ${q.kickoff || ""}</p>
      <p>${lamps(d.lights)}</p>
      <ul>
        <li>近5场：${(d.lights && d.lights.form_reason) || "无证据文件"}</li>
        <li>首发：${(d.lights && d.lights.lineup_reason) || "无证据文件"}</li>
        <li>伤停：${(d.lights && d.lights.injury_reason) || "无证据文件"}</li>
      </ul>
      <h3>量化轨</h3>
      <p>方向 ${q.direction || "-"} · 主/平/客 ${pct(q.final_1x2_pct)}</p>
      <p>比分Top ${(q.top_scores || []).join(" / ") || "-"}</p>
      <p>大小2.5 小 ${ou.under_pct ?? "-"} / 大 ${ou.over_pct ?? "-"}</p>
      <p>半全场 ${q.hafu ? (q.hafu.top + " " + q.hafu.pct + "%") : "-"}</p>
      <p>门控 ${zh(q.gate || "-")} · 模式 ${q.mode || "-"}</p>
      <h3>LLM 轨</h3>
      <p>胜平负 ${llm.direction || "未投票"}${llm.alt_direction ? " / " + llm.alt_direction : ""}</p>
      <p>主/平/客 ${pct(llm.probs_1x2)}（LLM加权，非量化校准）</p>
      <p>比分Top ${(llm.top_scores || []).join(" / ") || "-"}</p>
      <p>${llm.note || "与量化分列，不合成。"}</p>
      <h3>赛果</h3>
      <p>${res.score_90 ? res.score_90.join("-") : "未结算"} ${res.direction || ""}</p>
      <h3>证据事实</h3>
      <ul>${facts}</ul>`;
    document.getElementById("drawerMask").classList.add("on");
    document.getElementById("drawerPanel").classList.add("on");
  }).catch(e => banner("详情失败: " + e.message, "err"));
}

loadBoard().then(() => { if (!lastHistFull) return loadHistory(); });
</script>
