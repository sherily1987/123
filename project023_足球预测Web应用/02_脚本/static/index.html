<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <title>足球预测工作台</title>
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/responsive.css">
  <script type="module" src="/js/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#page-root">跳到主要内容</a>
  <div class="app-shell">
    <header class="app-header sidebar" id="app-sidebar">
      <div class="brand"><span class="brand-mark" aria-hidden="true"><img src="assets/match-lab-football.svg" alt=""></span><div><h1>MATCH <em>LAB</em></h1><p>足球量化预测工作台</p></div></div>
      <nav class="desktop-nav sidebar-nav" aria-label="工作台页面">
        <section class="nav-group" aria-labelledby="nav-workbench"><h2 id="nav-workbench">工作台</h2><a href="#overview" data-route="overview">总览</a><a href="#strategy" data-route="strategy">每日策略</a></section>
        <section class="nav-group" aria-labelledby="nav-analysis"><h2 id="nav-analysis">分析</h2><a href="#backtest" data-route="backtest">回测</a><a href="#leagues" data-route="leagues">联赛表现</a><a href="#evidence" data-route="evidence">证据审计</a></section>
        <section class="nav-group" aria-labelledby="nav-governance"><h2 id="nav-governance">治理与交付</h2><a href="#tasks" data-route="tasks">任务</a><a href="#versions" data-route="versions">版本治理</a><a href="#export" data-route="export">导出</a></section>
      </nav>
    </header>
    <div class="workspace">
      <header class="topbar control-deck">
        <button class="icon-button" id="sidebar-toggle" type="button" aria-label="打开导航" aria-controls="app-sidebar" aria-expanded="false">☰</button>
        <div class="topbar-controls"><span class="deck-label">实时分析系统</span><label class="sales-day">销售日<input id="sales-day" type="date"></label><button class="button button--primary" id="refresh-shell" type="button">刷新数据</button><span class="service-chip" aria-label="服务状态：界面就绪">SYSTEM ONLINE</span></div>
        <output class="global-status" id="global-status" aria-live="polite">正在加载工作台…</output>
      </header>
      <main class="page-root" id="page-root" tabindex="-1"></main>
    </div>
  </div>
  <div class="drawer-root" id="drawer-root" aria-live="polite"></div>
</body>
</html>
