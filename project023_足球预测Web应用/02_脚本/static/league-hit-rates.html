<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>联赛命中率 · 足球预测工作台</title>
<style>
:root { --bg:#0d1f17; --bg2:#123326; --card:#16382a; --ink:#e8f0eb; --muted:#8fae9e; --gold:#e9b44c; --green:#4ade80; --line:#27523e; }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font:14px "Microsoft YaHei",sans-serif; }
header { position:sticky; top:0; z-index:1; display:flex; align-items:center; gap:12px; padding:14px 24px; background:var(--bg2); border-bottom:1px solid var(--line); }
h1 { margin:0; color:var(--gold); font-size:18px; }
button { padding:7px 14px; background:var(--card); color:var(--ink); border:1px solid var(--line); border-radius:6px; cursor:pointer; }
button:hover { border-color:var(--gold); }
main { max-width:1100px; margin:0 auto; padding:18px 24px 32px; }
.note { margin:0 0 14px; color:var(--muted); font-size:12px; }
.day { margin:0 0 20px; border:1px solid var(--line); border-radius:10px; overflow:hidden; background:var(--card); }
.day h2 { margin:0; padding:10px 14px; font-size:16px; color:var(--gold); background:var(--bg2); }
table { width:100%; border-collapse:collapse; }
th,td { padding:10px 12px; text-align:center; border-top:1px solid var(--line); }
th { color:var(--muted); font-size:12px; background:rgba(13,31,23,.45); }
td:first-child,th:first-child { text-align:left; }
.rate { color:var(--green); font-weight:bold; }
.empty { padding:16px; border:1px solid var(--line); border-radius:8px; color:var(--muted); }
@media (max-width:640px) { header,main { padding-left:12px; padding-right:12px; } th,td { padding:8px 6px; font-size:12px; } }
</style>
</head>
<body>
<header>
  <h1>联赛命中率</h1>
  <button type="button" onclick="window.close()">关闭页面</button>
</header>
<main>
  <p class="note">汇总全部历史已结算场次；每个联赛仅一行。量化与 LLM 是独立轨道，不合并。</p>
  <div id="content" class="empty">正在读取历史回测…</div>
</main>
<script src="/league_hit_rates.js"></script>
<script>
function esc(value) {
  return String(value == null ? "" : value)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
function metric(label, value) {
  return value.n ? `<span class="rate">${value.rate}%</span>（${value.hit}/${value.n}）` : "—";
}
function render(history) {
  const sections = LeagueHitRates.buildLeagueHitRates(history);
  const content = document.getElementById("content");
  if (!sections.length) {
    content.textContent = "暂无已结算的命中率数据。";
    return;
  }
  content.className = "";
  content.innerHTML = `<section class="day">
    <h2>全部历史已结算场次</h2>
    <table><thead><tr><th>排名</th><th>联赛</th><th>量化命中率</th><th>LLM 命中率</th></tr></thead>
    <tbody>${sections.map(league => `<tr>
      <td>${league.rank}</td><td>${esc(league.league)}</td><td>${metric("量化", league.quant)}</td><td>${metric("LLM", league.llm)}</td>
    </tr>`).join("")}</tbody></table>
  </section>`;
}
fetch("/api/history?full=1&_=" + Date.now(), {cache:"no-store"})
  .then(response => response.ok ? response.json() : Promise.reject(new Error("历史回测读取失败")))
  .then(render)
  .catch(error => { document.getElementById("content").textContent = error.message; });
</script>
</body>
</html>
