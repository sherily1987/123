<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>足球预测工作台：旧版只读回滚</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, "Microsoft YaHei", sans-serif; background: #101713; color: #e8f0e9; }
    body { max-width: 1100px; margin: auto; padding: 20px; } header, section { margin: 18px 0; padding: 16px; border: 1px solid #31533d; border-radius: 12px; background: #16251c; }
    h1, h2 { color: #dcbf70; } button, a { padding: 8px 12px; border: 1px solid #dcbf70; border-radius: 7px; color: #101713; background: #dcbf70; font: inherit; cursor: pointer; text-decoration: none; }
    input { margin: 0 8px; padding: 7px; } table { width: 100%; border-collapse: collapse; } td, th { padding: 8px; text-align: left; border-bottom: 1px solid #31533d; }
    .muted { color: #b8c4ba; } .error { color: #ffadad; } .drawer { position: fixed; inset: 10% 8%; overflow: auto; padding: 20px; border: 1px solid #dcbf70; border-radius: 12px; background: #16251c; box-shadow: 0 10px 40px #000; }
  </style>
  <script defer src="/js/legacy.js"></script>
</head>
<body>
  <header>
    <p class="muted">旧版只读回滚</p><h1>足球预测工作台</h1>
    <label>销售日 <input id="sales-day" type="date"></label><button id="refresh" type="button">读取指定日</button>
    <a href="/api/export/report" download="体彩看板.md">导出只读报告</a><a href="/">进入新版工作台</a>
    <p id="status" class="muted">正在读取只读数据…</p>
  </header>
  <main>
    <section><h2>策略预览</h2><div id="strategy"></div></section>
    <section><h2>比赛浏览</h2><div id="matches"></div></section>
    <section><h2>全历史浏览</h2><p class="muted">默认展示后端返回的全部历史日期；上方日期仅筛选比赛与策略预览。</p><div id="history"></div></section>
  </main>
  <aside id="drawer" class="drawer" hidden aria-live="polite"></aside>
</body>
</html>
